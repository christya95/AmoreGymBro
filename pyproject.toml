[project]
name = "AmoreGymBro"
version = "0.1.0"
description = "Personal Hevy companion with goals, check-ins, and on-demand coaching"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "itsdangerous>=2.2,<3",
  "jinja2>=3.1,<4",
  "langchain>=1.1,<2",
  "langchain-openai>=1.0,<2",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "pymongo>=4.11,<5",
  "python-multipart>=0.0.12",
  "uvicorn[standard]>=0.32,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
